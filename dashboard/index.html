<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayAgentic Ops — Autonomous Settlement & ADK Audit</title>
  <!-- AG Grid Community Library & Alpine Dark Theme -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pass { background-color: #238636; color: #ffffff; }
    .badge-fail { background-color: #da3633; color: #ffffff; }
    .badge-hold { background-color: #d29922; color: #000000; }
    .badge-paypal { background-color: #0070ba; color: #ffffff; }
    .badge-active { background-color: #2ea043; color: #ffffff; }
    .refresh-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: #30363d; color: #fff; }
    #auditGrid {
      height: 620px;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="header-panel">
    <div>
      <h2 style="margin: 0; font-size: 22px; color: #f0f6fc;">PayAgentic // Settlement & ADK Audit Monitor</h2>
      <p style="margin: 4px 0 0; color: #8b949e; font-size: 13px;">
        Live monitoring of Autonomous Negotiations, PayPal Escrow Holds, and Google ADK Verifications
      </p>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="refresh-btn" onclick="fetchAuditDeals()">⟳ Refresh Feed</button>
      <span class="badge badge-paypal">PayPal Sandbox Connected</span>
      <span class="badge badge-active">Webhooks: ACTIVE</span>
    </div>
  </div>

  <!-- حاوية جدول AG Grid بالنمط الداكن -->
  <div id="auditGrid" class="ag-theme-alpine-dark"></div>

  <script>
    const columnDefs = [
      { field: "transaction_id", headerName: "Deal Ref", width: 130, pinned: "left" },
      { field: "package_id", headerName: "ADK LoRA Bundle", width: 230 },
      { field: "target_hardware", headerName: "Target HW", width: 160 },
      { 
        field: "base_price", 
        headerName: "Base ($)", 
        width: 110, 
        valueFormatter: p => p.value ? `$${p.value.toFixed(2)}` : "$0.00" 
      },
      { 
        field: "agreed_price", 
        headerName: "Settled ($)", 
        width: 120, 
        valueFormatter: p => p.value ? `$${p.value.toFixed(2)}` : "$0.00" 
      },
      { 
        field: "discount_pct", 
        headerName: "Discount", 
        width: 110, 
        valueFormatter: p => `${p.value}%` 
      },
      { 
        field: "guardrail_status", 
        headerName: "Policy Guardrail", 
        width: 160, 
        cellRenderer: p => {
          const cls = p.value === 'VERIFIED_PASS' ? 'badge-pass' : 'badge-fail';
          return `<span class="badge ${cls}">${p.value}</span>`;
        }
      },
      { 
        field: "adk_validation", 
        headerName: "ADK Integrity", 
        width: 140, 
        cellRenderer: p => {
          const cls = p.value === 'PASS' ? 'badge-pass' : 'badge-fail';
          return `<span class="badge ${cls}">${p.value}</span>`;
        }
      },
      { field: "paypal_order_id", headerName: "PayPal Order Ref", width: 170 },
      { 
        field: "deal_lifecycle", 
        headerName: "Lifecycle", 
        width: 140, 
        pinned: "right", 
        cellRenderer: p => {
          let cls = 'badge-hold';
          if (p.value === 'CAPTURED') cls = 'badge-pass';
          if (p.value === 'VOIDED') cls = 'badge-fail';
          return `<span class="badge ${cls}">${p.value}</span>`;
        }
      }
    ];

    let gridApi = null;

    const gridOptions = {
      columnDefs: columnDefs,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true,
        flex: 0
      },
      animateRows: true,
      pagination: true,
      paginationPageSize: 10
    };

    // تهيئة الجدول بالتوافق مع AG Grid الحديثة
    document.addEventListener("DOMContentLoaded", () => {
      const gridDiv = document.querySelector("#auditGrid");
      gridApi = agGrid.createGrid(gridDiv, gridOptions);
      fetchAuditDeals();
      // تحديث تلقائي للبيانات كل 5 ثوانٍ
      setInterval(fetchAuditDeals, 5000);
    });

    async function fetchAuditDeals() {
      try {
        const response = await fetch('/api/v1/dashboard/deals');
        if (!response.ok) throw new Error("Failed to fetch deals");
        const deals = await response.json();
        if (gridApi) {
          gridApi.setGridOption('rowData', deals);
        }
      } catch (err) {
        console.error("Error loading AG Grid deals:", err);
      }
    }
  </script>
</body>
</html>
